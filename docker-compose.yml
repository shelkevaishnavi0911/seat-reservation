
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: seat_reservation
      MYSQL_USER: reservation_user
      MYSQL_PASSWORD: ${MYSQLPASSWORD:?Set MYSQLPASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    image: seat-reservation:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      MYSQLHOST: mysql
      MYSQLPORT: 3306
      MYSQLDATABASE: seat_reservation
      MYSQLUSER: reservation_user
      MYSQLPASSWORD: ${MYSQLPASSWORD:?Set MYSQLPASSWORD in .env}
      DDL_AUTO: update
    ports:
      - "8080:8080"

volumes:
  mysql_data: